name: Pull-CI

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  build:
    env:
      PYTHON_VERSIONS: "3.11"

    runs-on: gh-64c
    steps:
      - name: Clone chDB repository
        uses: actions/checkout@v2
        with:
          repository: "chdb-io/chdb"
          ref: "refs/pull/${{ github.event.pull_request.number }}/merge"
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v2
        with:
          python-version: 3.11

      - name: Install ruff
        run: python -m pip install ruff

      - name: Lint datastore with ruff
        run: |
          # Configuration in pyproject.toml [tool.ruff]
          ruff check datastore --statistics

  # The chdb and chdb-core wheels both ship chdb/__init__.py, so whichever
  # installs last owns the `chdb.func` entry point. Install in both orders
  # and assert deploy support survives each — directly when this repo's
  # __init__.py wins, via the `import datastore` self-repair when
  # chdb-core's wins. The UDF deploy unit suite runs in both orders too
  # (the integration suite lives in the External ClickHouse workflow).
  udf-install-order:
    name: UDF install order (${{ matrix.order }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Which wheel writes the shared chdb/__init__.py last.
        order: [wrapper-last, core-last]
    steps:
      - uses: actions/checkout@v4
        with:
          repository: "chdb-io/chdb"
          ref: "refs/pull/${{ github.event.pull_request.number }}/merge"
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build the chdb wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist .

      - name: Install (wrapper last — this repo's __init__.py wins)
        if: matrix.order == 'wrapper-last'
        run: |
          pip install chdb-core pandas pyarrow pytest
          pip install --no-deps dist/*.whl

      - name: Install (core last — chdb-core's __init__.py wins)
        if: matrix.order == 'core-last'
        run: |
          pip install --no-deps dist/*.whl
          pip install chdb-core pandas pyarrow pytest

      - name: Assert deploy entry point survives this order
        run: |
          python - <<'PY'
          import inspect

          import chdb

          direct = "deploy" in inspect.signature(chdb.func).parameters

          import datastore  # noqa: F401  triggers the chdb.deploy self-repair

          repaired = "deploy" in inspect.signature(chdb.func).parameters
          print(f"direct={direct} after-datastore-import={repaired}")
          assert repaired, (
              "chdb.func lacks deploy support even after importing datastore"
          )

          import chdb.deploy  # the module itself must import cleanly

          assert chdb.func is chdb.deploy.func
          PY

      - name: Run unit tests in this order
        run: pytest tests/udf_deploy/test_deploy_unit.py -q
