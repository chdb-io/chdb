name: Build & Test macOS arm64

on:
  workflow_dispatch:
    inputs:
      TAG_NAME:
        description: 'Release Version Tag'
        required: true
  release:
    types: [created]
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '.github/workflows/external_clickhouse_integration.yaml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '.github/workflows/external_clickhouse_integration.yaml'

jobs:
  test_datastore:
    name: Test DataStore (macOS arm64)
    runs-on: macos-15-xlarge
    if: ${{ !github.event.pull_request.draft }}
    timeout-minutes: 120
    steps:
      - name: Check machine architecture
        run: |
          echo "=== Machine Architecture Information ==="
          echo "Machine type: $(uname -m)"
          echo "Architecture: $(arch)"
          echo "System info: $(uname -a)"
      - name: Setup pyenv
        run: |
          curl https://pyenv.run | bash
          export PATH="$HOME/.pyenv/bin:$PATH"
          eval "$(pyenv init -)"

          plain_pyenv_version() {
            local pattern="${1//./\\.}"
            pyenv versions --bare 2>/dev/null | grep -E "^${pattern}\.[0-9]+$" | tail -1
          }

          INSTALLED=""
          for v in 3.9 3.10 3.11 3.12 3.13 3.14; do
            echo "=== Installing Python $v ==="
            pyenv install "$v:latest"
            installed_version="$(plain_pyenv_version "$v")"
            if [ -z "$installed_version" ]; then
              echo "pyenv installed no non-free-threaded Python $v"
              exit 1
            fi
            INSTALLED="$INSTALLED $installed_version"
          done
          pyenv global $INSTALLED

          echo "Installed versions:"
          pyenv versions
      - name: Install dependencies for all Python versions
        run: |
          export PATH="$HOME/.pyenv/bin:$PATH"
          eval "$(pyenv init -)"
          plain_pyenv_version() {
            local pattern="${1//./\\.}"
            pyenv versions --bare 2>/dev/null | grep -E "^${pattern}\.[0-9]+$" | tail -1
          }
          for version in 3.9 3.10 3.11 3.12 3.13 3.14; do
            PYTHON_VERSION="$(plain_pyenv_version "$version")"
            if [ -z "$PYTHON_VERSION" ]; then continue; fi
            echo "Installing dependencies for Python $PYTHON_VERSION"
            pyenv shell "$PYTHON_VERSION"
            python -m pip install --upgrade pip
            python -m pip install setuptools tox pandas pyarrow wheel pytest pytest-cov
            pyenv shell --unset
          done
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Build wheel
        run: |
          export PATH="$HOME/.pyenv/bin:$PATH"
          eval "$(pyenv init -)"
          plain_pyenv_version() {
            local pattern="${1//./\\.}"
            pyenv versions --bare 2>/dev/null | grep -E "^${pattern}\.[0-9]+$" | tail -1
          }
          PYTHON_VERSION="$(plain_pyenv_version 3.9)"
          if [ -z "$PYTHON_VERSION" ]; then echo "Python 3.9 not available"; exit 1; fi
          pyenv shell "$PYTHON_VERSION"
          make wheel
      - name: Show files
        run: |
          ls -lh dist
        shell: bash
      - name: Test DataStore on all Python versions with pandas 2.x and 3.x
        run: |
          export PATH="$HOME/.pyenv/bin:$PATH"
          eval "$(pyenv init -)"
          plain_pyenv_version() {
            local pattern="${1//./\\.}"
            pyenv versions --bare 2>/dev/null | grep -E "^${pattern}\.[0-9]+$" | tail -1
          }

          for version in 3.9 3.10 3.11 3.12 3.13 3.14; do
            PYTHON_VERSION="$(plain_pyenv_version "$version")"
            if [ -z "$PYTHON_VERSION" ]; then
              echo "Python $version not available, skipping"
              continue
            fi
            # pandas 3.x requires Python >= 3.11
            if [[ "$version" == "3.9" || "$version" == "3.10" ]]; then
              PANDAS_CONSTRAINTS=("pandas<3.0")
            else
              PANDAS_CONSTRAINTS=("pandas<3.0" "pandas>=3.0")
            fi
            for PANDAS_CONSTRAINT in "${PANDAS_CONSTRAINTS[@]}"; do
              echo "=============================================="
              echo "Testing DataStore on Python $PYTHON_VERSION with $PANDAS_CONSTRAINT"
              echo "=============================================="

              pyenv shell "$PYTHON_VERSION"
              python -m pip install dist/*.whl --force-reinstall
              python -m pip install pytest pytest-cov hypothesis "$PANDAS_CONSTRAINT"
              echo "Installed pandas version:"
              python -c "import pandas; print(pandas.__version__)"

              echo "Running DataStore tests on Python $PYTHON_VERSION with $PANDAS_CONSTRAINT ..."
              cd datastore
              python -m pytest tests/ -v --tb=short -x
              cd ..
              echo "=============================================="
              echo "DataStore tests PASSED on Python $PYTHON_VERSION with $PANDAS_CONSTRAINT"
              echo "=============================================="
              pyenv shell --unset
            done
          done
        continue-on-error: false
      - name: Test chdb.durable (Durable V1 conformance)
        run: |
          export PATH="$HOME/.pyenv/bin:$PATH"
          eval "$(pyenv init -)"
          plain_pyenv_version() {
            local pattern="${1//./\\.}"
            pyenv versions --bare 2>/dev/null | grep -E "^${pattern}\.[0-9]+$" | tail -1
          }

          # One Python is enough: this suite exercises the protocol and the
          # filesystem primitives under it (flock, hard-link create, atomic
          # rename), not the Python matrix, and it is the platform differences
          # that are worth the four jobs.
          PYTHON_VERSION=""
          for version in 3.12 3.11 3.13 3.10 3.9 3.14; do
            candidate="$(plain_pyenv_version "$version")"
            if [ -n "$candidate" ]; then
              PYTHON_VERSION="$candidate"
              break
            fi
          done
          if [ -z "$PYTHON_VERSION" ]; then
            echo "No suitable Python found; skipping the durable suite"
            exit 0
          fi

          pyenv shell "$PYTHON_VERSION"
          python -m pip install dist/*.whl --force-reinstall
          python -m pip install pytest

          # Move the engine to the pre-release that carries the Durable V1 ABI,
          # then put the wrapper back on top of it.
          #
          # The second install is not redundant. chdb and chdb-core both own
          # chdb/__init__.py, so whichever lands last wins, and the wrapper's
          # is the one that has to: chdb-core ships a superset that happens to
          # work today, which is not a property to build a test job on.
          #
          # --no-deps on both keeps pip from re-resolving chdb-core back down
          # to what PyPI offers.
          python -m pip install --force-reinstall --no-deps "$CHDB_CORE_ABI_WHEEL"
          python -m pip install dist/*.whl --force-reinstall --no-deps

          # Name the engine under test before running anything, so the wrong
          # one is one line of output rather than 49 collection errors.
          python - <<'PY'
          import sys
          from chdb.durable.engine import engine_has_v1_abi, engine_version
          if not engine_has_v1_abi():
              sys.exit("chdb-core does not export the Durable V1 ABI")
          print("durable conformance: chdb-core " + engine_version())
          PY

          # Exit 5 — pytest collecting nothing — used to be tolerated here,
          # because a module-level skip was the expected outcome on an engine
          # without the ABI. With the engine pinned there is nothing left for
          # that tolerance to excuse: collecting nothing now means the suite
          # stopped running, so the exit status stands on its own.
          python -m pytest tests/test_durable.py -v --tb=short
        env:
          # Pinned, and pinned to a pre-release on purpose.
          #
          # No chdb-core on PyPI exports backup_database / restore_database /
          # classify_query — 26.7.0 is the newest published — so resolving
          # the dependency normally leaves this suite skipping itself, and a
          # step that is green whether or not it ran is not a check. The wheels
          # are already attached to the chdb-core release, so pinning one costs
          # a download and no build.
          #
          # This comes out when a chdb-core carrying the ABI is what pip
          # resolves by default and chdb's floor rises to match. Until then the
          # pre-release version keeps anything here from reading as a stable
          # dependency.
          CHDB_CORE_ABI_WHEEL: https://github.com/chdb-io/chdb-core/releases/download/v26.7.2-rc.2/chdb_core-26.7.2-cp39-abi3-macosx_11_0_arm64.whl
        continue-on-error: false
