# ClickHouse server used by the UDF deploy integration tests
# (tests/udf_deploy/test_deploy_integration.py).
#
# This file is the single source of truth for the test environment; CI and
# local developers share it. Bring the server up with:
#
#   mkdir -p .github/ci/udf-scripts .github/ci/udf-config
#   docker compose -f .github/ci/clickhouse-udf.yml up -d --build --wait
#
# Tear down with:
#
#   docker compose -f .github/ci/clickhouse-udf.yml down -v
#
# Then point the tests at it via:
#
#   CHDB_TEST_UDF_HTTP=localhost:8125
#   CHDB_TEST_UDF_SCRIPTS_DIR=$PWD/.github/ci/udf-scripts
#   CHDB_TEST_UDF_CONFIG_DIR=$PWD/.github/ci/udf-config
#
# The two bind mounts are the UDF delivery channel: chdb.deploy writes the
# generated script + XML config into them locally, and the server loads the
# same files through user_scripts_path / user_defined_executable_functions_config
# (pinned by udf-server-config.xml). Ports avoid the writeback pair's
# 9000/9001/8123/8124 so both stacks can run side by side.

name: chdb-ds-udf

services:
  ch-udf:
    build:
      context: .
      dockerfile: Dockerfile.clickhouse-udf
    container_name: chdb_ds_udf
    environment:
      # Test-only: skip the entrypoint's user setup, which would otherwise
      # restrict the passwordless default user to localhost — the tests
      # connect through the published port (i.e. from the docker bridge).
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    ports:
      - "8125:8123"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - ./udf-server-config.xml:/etc/clickhouse-server/config.d/udf.xml:ro
      - ./udf-scripts:/var/lib/clickhouse/user_scripts
      - ./udf-config:/var/lib/clickhouse/user_defined_functions
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 30
